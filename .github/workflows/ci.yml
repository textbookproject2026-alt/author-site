# The browser tests on every pull request and push to main.
#   site       test/site.test.mjs: every screen against stubbed endpoints, with the CSP;
#              test/phone-audit.test.mjs: the phone audit on every screen (batch 2b)
#   questions  test/questions.test.mjs: the converter's Python in real Pyodide, byte for
#              byte against the same Python run here. Needs authoring-assistant readable
#              without credentials (it is fetched as the Pages build fetches it).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node --test --test-concurrency=1 test/site.test.mjs test/contents.test.mjs test/phone-audit.test.mjs test/functions.test.mjs

  questions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: The converter, as the Pages build fetches it
        run: node scripts/fetch-converter.mjs
      - name: The same converter, to compare with
        run: |
          ref=$(node -p 'require("./converter.json").ref')
          git clone --quiet --filter=blob:none https://github.com/textbookproject2026-alt/authoring-assistant.git "$RUNNER_TEMP/converter"
          git -C "$RUNNER_TEMP/converter" checkout --quiet "$ref"
      - run: node --test --test-concurrency=1 test/questions.test.mjs
        env:
          CONVERTER_DIR: ${{ runner.temp }}/converter
          REQUIRE_CONVERTER: '1'

  # After a push to main: the custom domain must pass on _headers' Cache-Control for
  # the modules. A Cloudflare zone's Browser Cache TTL rewrote it to max-age=14400 once,
  # and browsers kept PR #1's modules for hours after PR #2 deployed (README, Deploy).
  production-headers:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          for f in app.js lib/screens-books.js styles.css; do
            cc=$(curl -sfI "https://author.confused4now.org/$f" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
            echo "$f: $cc"
            [ "$cc" = "no-cache" ] || { echo "::error::author.confused4now.org/$f is served with Cache-Control '$cc', not _headers' no-cache"; exit 1; }
          done
